name: Auto Update Market Data

"on":
  schedule:
    # 매시 7분, 37분 실행 (정각 혼잡 지연 회피 + 장중 30분 간격 최신화)
    - cron: "7,37 * * * *"
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: market-data-sync
  cancel-in-progress: true

jobs:
  sync-market-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Fast Sync Insights Backup Only (on Issue change)
        if: github.event_name == 'issues'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/sync_insights.py

      - name: Install dependencies (for Market & Macro Sync)
        if: github.event_name != 'issues'
        run: pip install -r scripts/requirements.txt

      - name: Collect latest market, macro, and insights data
        if: github.event_name != 'issues'
        env:
          BOK_ECOS_API_KEY: ${{ secrets.BOK_ECOS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/update_market_data.py

      - name: Commit and push updated JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch data/insights.json
          git add data/live_market.json data/insights.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(data): auto-sync market & insights data"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin HEAD: main
          fi
